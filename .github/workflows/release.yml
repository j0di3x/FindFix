name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The layered AppIcon.icon needs Xcode 26 or newer: use the newest installed.
      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Test
        run: xcodebuild -scheme FindFix test -quiet

      - name: Build DMG
        run: Scripts/make-dmg.sh dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "FindFix ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Keep DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindFix-dmg
          path: dist/*.dmg
