name: Release

# Manual only: releases are usually built on a Mac with Scripts/make-dmg.sh.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The layered AppIcon.icon needs Xcode 26 or newer: use the newest installed.
      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Test
        run: xcodebuild -scheme FindFix test -quiet

      - name: Build DMG
        run: Scripts/make-dmg.sh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(basename dist/*.dmg | sed -E 's/FindFix-(.*)-arm64.dmg/\1/')"
          gh release create "v$VERSION" dist/*.dmg --target "$GITHUB_SHA" \
            --title "FindFix $VERSION" --generate-notes

      - name: Keep DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindFix-dmg
          path: dist/*.dmg
